# Start everything:   docker compose up -d --build      → API + Swagger at http://localhost:8080
# Only the database:  docker compose up -d mysql        (then run services from your IDE)
#
# Clients talk to the gateway only (port 8080). Service ports are bound to 127.0.0.1 for debugging.
name: shiptrack

x-service-env: &service-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}

x-depends-on-mysql: &depends-on-mysql
  mysql:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Single node, no replicas: the binary log only adds a second disk sync per commit.
    command: ["--skip-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: on first boot MySQL runs a temporary socket-only server while it creates the
      # databases, and a socket ping would report "healthy" too early.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=TCP -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    depends_on: *depends-on-mysql
    environment:
      <<: *service-env
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8081:8081"

  shipment-service:
    build:
      context: .
      dockerfile: shipment-service/Dockerfile
    restart: unless-stopped
    depends_on: *depends-on-mysql
    environment:
      <<: *service-env
      AUTH_SERVICE_URL: http://auth-service:8081
      BILLING_SERVICE_URL: http://billing-service:8083
      BILLING_RETRY_INTERVAL: ${BILLING_RETRY_INTERVAL:-60s}
    ports:
      - "127.0.0.1:8082:8082"

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    restart: unless-stopped
    depends_on: *depends-on-mysql
    environment:
      <<: *service-env
      PRICING_CURRENCY: ${PRICING_CURRENCY:-PKR}
      PRICING_BASE_FEE: ${PRICING_BASE_FEE:-250.00}
      PRICING_PER_KG_RATE: ${PRICING_PER_KG_RATE:-120.00}
    ports:
      - "127.0.0.1:8083:8083"

  tracking-service:
    build:
      context: .
      dockerfile: tracking-service/Dockerfile
    restart: unless-stopped
    depends_on: *depends-on-mysql
    environment:
      <<: *service-env
      SHIPMENT_SERVICE_URL: http://shipment-service:8082
    ports:
      - "127.0.0.1:8084:8084"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      SHIPMENT_SERVICE_URL: http://shipment-service:8082
      BILLING_SERVICE_URL: http://billing-service:8083
      TRACKING_SERVICE_URL: http://tracking-service:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"

volumes:
  mysql-data:
