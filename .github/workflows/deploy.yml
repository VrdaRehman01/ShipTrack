name: Deploy

# Only main deploys: after CI passes on main (or by hand), build the images, push them to ECR and roll the
# EC2 stack over via SSM. Logs in with keyless OIDC (AWS_DEPLOY_ROLE_ARN variable) when the account allows it,
# otherwise with a deploy-only IAM user's key (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets).
# Skips itself until the AWS_REGION variable is set (docs/DEPLOYMENT.md), so it is safe before AWS exists.
# The instance is found by its Name tag (shiptrack-prod), so a replaced instance is picked up automatically.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SERVICES: auth-service shipment-service billing-service tracking-service api-gateway frontend

jobs:
  deploy:
    if: >-
      vars.AWS_REGION != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: AWS login (keyless OIDC)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: AWS login (deploy user key)
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push images (tag = commit SHA)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for svc in $SERVICES; do
            docker buildx build -f "$svc/Dockerfile" \
              --cache-from "type=gha,scope=$svc" --cache-to "type=gha,mode=max,scope=$svc" \
              -t "$REGISTRY/shiptrack/$svc:$IMAGE_TAG" --push .
          done

      - name: Find the instance and make sure it is running
        run: |
          read -r id state <<<"$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=shiptrack-prod Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[] | sort_by(@, &LaunchTime)[-1].[InstanceId,State.Name]' --output text)"
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "::error::No instance tagged shiptrack-prod. Create the stack first (docs/DEPLOYMENT.md)."; exit 1
          fi
          if [ "$state" != "running" ]; then
            echo "::error::Instance $id is $state. Start it (see docs/DEPLOYMENT.md) and re-run this workflow."; exit 1
          fi
          echo "INSTANCE_ID=$id" >> "$GITHUB_ENV"
          echo "Deploying to $id"
          # A freshly created instance installs Docker on first boot; wait until its SSM agent is online.
          for i in $(seq 1 30); do
            ping=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$id" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>&1 || true)
            [ "$ping" = "Online" ] && break
            # Older stacks lack ssm:DescribeInstanceInformation: don't wait, just try the deploy.
            case "$ping" in *AccessDenied*) echo "Can't check the SSM agent (update the stack to enable this); continuing"; break;; esac
            echo "Waiting for SSM agent on $id ($ping)"; sleep 10
          done

      - name: Deploy on the instance via SSM
        run: |
          b64() { base64 -w0 "$1"; }
          cat > params.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "mkdir -p /opt/shiptrack/mysql-init",
              "echo $(b64 infra/aws/docker-compose.prod.yml) | base64 -d > /opt/shiptrack/docker-compose.prod.yml",
              "echo $(b64 scripts/deploy-on-host.sh) | base64 -d > /opt/shiptrack/deploy-on-host.sh",
              "echo $(b64 docker/mysql/init/01-create-databases.sh) | base64 -d > /opt/shiptrack/mysql-init/01-create-databases.sh",
              "bash /opt/shiptrack/deploy-on-host.sh $IMAGE_TAG"
            ],
            "executionTimeout": ["1200"]
          }
          EOF
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "ShipTrack deploy $IMAGE_TAG" --parameters file://params.json \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/shiptrack/prod" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          for i in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1 ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

      - id: smoke
        name: Smoke test through the public gateway
        run: |
          host=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicDnsName' --output text)
          site=$(aws cloudformation describe-stacks --stack-name shiptrack             --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" --output text 2>/dev/null || true)
          case "$site" in https://*) ;; *) site="http://$host";; esac
          echo "url=$site/" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -fsS "http://$host/actuator/health" | grep -q UP && curl -fsS "http://$host/healthz" >/dev/null; then
              curl -fsS -o /dev/null -w "public tracking (expect 404): %{http_code}\n" \
                "http://$host/api/v1/public/shipments/ST-2000-000000" || true
              echo "### Deployed \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Website: $site/" >> "$GITHUB_STEP_SUMMARY"
              echo "- Swagger: $site/swagger-ui.html" >> "$GITHUB_STEP_SUMMARY"
              echo "- Server (plain http, for debugging): http://$host/" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Gateway health check failed"; exit 1
