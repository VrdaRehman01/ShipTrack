name: CI

# Every push and PR: build -> unit + integration tests -> Checkstyle -> coverage (70% gate),
# then start the whole stack in Docker Compose and run the Postman flow with Newman.
# A failing step blocks the merge (make "CI / build-and-test" and "CI / api-tests" required checks on main).
on:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the runner's Docker for the MySQL integration tests.
      - name: Build, test, Checkstyle and coverage gate
        run: ./mvnw -B verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "*/target/site/jacoco/"
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "*/target/surefire-reports/"

  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create throwaway .env for CI
        run: |
          cp .env.example .env
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^INTERNAL_API_KEY=.*|INTERNAL_API_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=Ci-admin-$(openssl rand -hex 6)|" .env

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 480

      - name: Run Postman collection through the gateway
        run: |
          set -a; . ./.env; set +a
          docker run --rm --network host -v "$PWD/postman:/etc/newman" postman/newman:6-alpine \
            run ShipTrack.postman_collection.json \
            --env-var baseUrl=http://localhost:8080 \
            --env-var adminEmail="$ADMIN_EMAIL" \
            --env-var adminPassword="$ADMIN_PASSWORD"

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
