name: CI

# Every push and PR: build -> unit + integration tests -> Checkstyle -> coverage (70% gate),
# then start the whole stack in Docker Compose and run the Postman flow with Newman.
# A failing step blocks the merge (make "CI / build-and-test" and "CI / api-tests" required checks on main).
on:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the runner's Docker for the MySQL integration tests.
      - name: Build, test, Checkstyle and coverage gate
        run: ./mvnw -B verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "*/target/site/jacoco/"
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "*/target/surefire-reports/"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build

  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create throwaway .env for CI
        run: |
          cp .env.example .env
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^INTERNAL_API_KEY=.*|INTERNAL_API_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=Ci-admin-$(openssl rand -hex 6)|" .env

      - name: Build images
        run: docker compose build

      # Docker Hub pulls fail now and then on shared runners; retry the image download before starting.
      - name: Start MySQL
        run: |
          for i in 1 2 3 4; do
            docker compose pull mysql && break
            echo "Pull failed (attempt $i), retrying in $((i * 10))s"; sleep $((i * 10))
          done
          docker compose up -d --wait --wait-timeout 240 mysql

      - name: Start services and gateway
        run: docker compose up -d --wait --wait-timeout 480

      - name: Website serves the app and proxies the API
        run: |
          curl -fsS http://localhost:4200/healthz
          curl -fsS http://localhost:4200/ | grep -q '<app-root>'
          curl -fsS -o /dev/null http://localhost:4200/track
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:4200/api/v1/public/shipments/ST-2000-000000)" = 404
          curl -fsSI http://localhost:4200/ | grep -qi 'content-security-policy'
          # As CloudFront sends it (https outside, http inside): a same-site POST must not be rejected as CORS (403).
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:4200/api/v1/auth/login             -H 'Host: shiptrack.example' -H 'CloudFront-Forwarded-Proto: https' -H 'Origin: https://shiptrack.example'             -H 'Content-Type: application/json' -d '{}')
          echo "login behind CloudFront: $code (expect 400)"; test "$code" = 400

      - name: Run Postman collection through the gateway
        run: |
          set -a; . ./.env; set +a
          docker run --rm --network host -v "$PWD/postman:/etc/newman" postman/newman:6-alpine \
            run ShipTrack.postman_collection.json \
            --env-var baseUrl=http://localhost:8080 \
            --env-var adminEmail="$ADMIN_EMAIL" \
            --env-var adminPassword="$ADMIN_PASSWORD"

      # Also written as annotations: those are readable through the public API without signing in.
      - name: Diagnostics on failure
        if: failure()
        run: |
          {
            echo "## Container status"; echo '```'; docker compose ps -a; echo '```'
            echo "## MySQL health history"; echo '```'
            docker inspect --format '{{json .State.Health}}' shiptrack-mysql-1 2>/dev/null | head -c 3000; echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          esc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=compose ps::$(docker compose ps -a --format '{{.Service}} {{.Status}}' | esc)"
          echo "::error title=mysql health::$(docker inspect --format '{{json .State.Health}}' shiptrack-mysql-1 2>&1 | tail -c 1500 | esc)"
          echo "::error title=mysql logs::$(docker compose logs --no-color --tail=25 mysql 2>&1 | cut -c1-220 | esc)"
          for svc in auth-service shipment-service billing-service tracking-service api-gateway web; do
            if ! docker compose ps --status running --format '{{.Health}}' "$svc" 2>/dev/null | grep -q '^healthy$'; then
              echo "::error title=$svc logs::$(docker compose logs --no-color --tail=20 "$svc" 2>&1 | cut -c1-220 | esc)"
            fi
          done
          docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
