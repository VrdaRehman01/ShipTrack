spring.application.name=auth-service
server.port=${AUTH_SERVICE_PORT:8081}
# Trust X-Forwarded-* from the gateway (correct URLs in Swagger and Location headers).
server.forward-headers-strategy=framework
spring.threads.virtual.enabled=true

# Lets you run from the IDE using the repo-root .env (git-ignored). Missing file is fine.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database (no secrets here: values come from env / .env) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${AUTH_DB_NAME:auth_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Default pool (10) queues requests at ~100 concurrent users; MySQL allows 151 connections in total.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/migration

# --- Security (shiptrack-common) ---
shiptrack.jwt.secret=${JWT_SECRET}
shiptrack.jwt.expiration=${JWT_EXPIRATION:15m}
shiptrack.jwt.issuer=shiptrack-auth
shiptrack.security.public-paths=/api/v1/auth/register,/api/v1/auth/login

# --- Optional first admin account (created on startup if both are set) ---
shiptrack.admin.email=${ADMIN_EMAIL:}
shiptrack.admin.password=${ADMIN_PASSWORD:}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Server URL is computed per request, so it's right both directly and through the gateway.
springdoc.cache.disabled=true
