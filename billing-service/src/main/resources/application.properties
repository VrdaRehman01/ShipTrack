spring.application.name=billing-service
server.port=${BILLING_SERVICE_PORT:8083}
server.forward-headers-strategy=framework
spring.threads.virtual.enabled=true

# Lets you run from the IDE using the repo-root .env (git-ignored). Missing file is fine.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${BILLING_DB_NAME:billing_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/migration

# --- Security (shiptrack-common) ---
shiptrack.jwt.secret=${JWT_SECRET}
shiptrack.jwt.issuer=shiptrack-auth
# shipment-service calls POST /internal/invoices with this key.
shiptrack.security.internal-api-key=${INTERNAL_API_KEY:}

# --- Pricing: amount = base-fee + per-kg-rate x weight ---
shiptrack.pricing.currency=${PRICING_CURRENCY:PKR}
shiptrack.pricing.base-fee=${PRICING_BASE_FEE:250.00}
shiptrack.pricing.per-kg-rate=${PRICING_PER_KG_RATE:120.00}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.cache.disabled=true
