AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ShipTrack demo environment (ADR 0007): one EC2 instance running the Docker Compose stack, images in ECR,
  secrets in Secrets Manager, logs in CloudWatch, a monthly budget alarm, and a least-privilege identity for GitHub Actions deploys.
  On AWS Free plan accounts the instance type is free-tier eligible; disk, Elastic IP and the secret are a few
  dollars a month from free credits. CloudFront gives the site https at no extra cost for demo traffic.

Parameters:
  AlertEmail:
    Type: String
    Description: Email that receives the budget alarm (confirm the subscription email AWS sends).
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    Description: Alert when actual or forecast monthly spend passes this amount.
  GitHubRepo:
    Type: String
    Default: VrdaRehman01/ShipTrack
    Description: owner/repo allowed to deploy (main branch only).
  GitHubAuthMode:
    Type: String
    Default: accessKey
    AllowedValues: [accessKey, oidc]
    Description: >
      How GitHub Actions logs in to deploy. "oidc" = keyless (preferred, but blocked on AWS Free plan "project"
      accounts by an organization policy). "accessKey" = a deploy-only IAM user; you create its key in CloudShell
      and store it in GitHub Secrets.
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Only for oidc mode. Set to false if the account already has the GitHub OIDC provider.
  InstanceType:
    Type: String
    Default: c7i-flex.large
    AllowedValues: [c7i-flex.large, m7i-flex.large, t3.medium, t3.large]
    Description: >
      4 GB RAM is the minimum for 5 JVM services + MySQL. c7i-flex.large (4 GB) and m7i-flex.large (8 GB) are
      free-tier eligible on AWS Free plan accounts; t3.* are not.
  CloudFrontPrefixListId:
    Type: String
    Default: pl-b8a742d1
    AllowedPattern: "^pl-[0-9a-f]+$"
    Description: >
      AWS's list of CloudFront addresses in this region (the default is Sydney's), the only addresses allowed to
      reach port 80. Find it with: aws ec2 describe-managed-prefix-lists
      --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
  AdminEmail:
    Type: String
    Default: admin@shiptrack.demo
    Description: Login for the first ADMIN account (its password is generated into Secrets Manager).

Conditions:
  UseOidc: !Equals [!Ref GitHubAuthMode, oidc]
  UseAccessKey: !Equals [!Ref GitHubAuthMode, accessKey]
  CreateOidc: !And [!Condition UseOidc, !Equals [!Ref CreateGitHubOidcProvider, "true"]]

Resources:
  # ------------------------------------------------------------------ images
  AuthRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: shiptrack/auth-service
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      LifecyclePolicy: { LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}' }
  ShipmentRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: shiptrack/shipment-service
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      LifecyclePolicy: { LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}' }
  BillingRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: shiptrack/billing-service
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      LifecyclePolicy: { LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}' }
  TrackingRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: shiptrack/tracking-service
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      LifecyclePolicy: { LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}' }
  GatewayRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: shiptrack/api-gateway
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      LifecyclePolicy: { LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}' }

  FrontendRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: shiptrack/frontend
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true
      LifecyclePolicy: { LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}' }

  # ------------------------------------------------------------------ secrets (one secret = USD 0.40/month)
  # AWS generates the JWT secret; the first deploy adds the DB, internal-key and admin passwords
  # (random, generated on the instance) to this same secret. Nothing secret is ever in Git.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: shiptrack/prod
      Description: ShipTrack production secrets (JSON). Read the admin password with the command in docs/DEPLOYMENT.md.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: jwtSecret
        PasswordLength: 64
        ExcludePunctuation: true

  # ------------------------------------------------------------------ logs
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /shiptrack/prod
      RetentionInDays: 7

  # ------------------------------------------------------------------ the instance
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # shell + deploys via SSM, no SSH port
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: shiptrack-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:PutSecretValue]
                Resource: !Ref AppSecret
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${LogGroup.Arn}:*"
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub "${DatabaseBackups.Arn}/*"

  DatabaseBackups:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "shiptrack-db-backups-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDatabaseBackups
            Status: Enabled
            ExpirationInDays: 30

  DatabaseBackupsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DatabaseBackups
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DatabaseBackups.Arn
              - !Sub "${DatabaseBackups.Arn}/*"
            Condition:
              Bool: { aws:SecureTransport: "false" }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Don't edit the description: changing it makes CloudFormation replace the security group.
      GroupDescription: ShipTrack website and API on port 80 only (no SSH; use SSM Session Manager)
      # CloudFront only, so nobody can use the site over plain http or get around its rate limits.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      # Dynamic reference, not an SSM parameter type: an SSM parameter type re-resolves "latest" on EVERY stack
      # update, so a newer Amazon Linux release silently REPLACES the instance (and wipes its database). This is
      # resolved when the instance is created and then left alone on later updates.
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 16, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: shiptrack-prod }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker jq
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          mkdir -p /opt/shiptrack
          # Values the deploy script needs; secrets themselves stay in Secrets Manager.
          cat > /opt/shiptrack/stack.env <<EOF
          AWS_REGION=${AWS::Region}
          ECR_REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          LOG_GROUP=${LogGroup}
          BACKUP_BUCKET=shiptrack-db-backups-${AWS::AccountId}-${AWS::Region}
          ADMIN_EMAIL=${AdminEmail}
          EOF

  # ------------------------------------------------------------------ fixed address + https (ADR 0009)
  # A fixed public IP, so the server keeps its address across stop/start and CloudFront always finds it.
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: shiptrack-prod }

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  # API responses must never be shared between users. Caching is effectively off (max 1 s, and the services send
  # Cache-Control: no-store), and Authorization is part of the key, which is also what makes CloudFront forward it.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-api-no-cache"
        Comment: ShipTrack API and pages - effectively uncached, per-user
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  # https://<something>.cloudfront.net in front of the server: browsers get a secure site (needed for drivers' GPS),
  # with no domain or certificate to buy.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ShipTrack website and API
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: shiptrack-server
            # The Elastic IP's public DNS name (CloudFront needs a host name, not an IP).
            DomainName: !Sub
              - "ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com"
              - Dashed: !Join ["-", !Split [".", !Ref ElasticIp]]
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: shiptrack-server
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref ApiCachePolicy
          # Managed "AllViewerAndCloudFrontHeaders-2022-06": all viewer headers plus CloudFront-Forwarded-Proto,
          # so nginx can tell the backend the original request was https.
          OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc
        CacheBehaviors:
          # Hashed build files never change: cache them at the edge (managed "CachingOptimized").
          - PathPattern: "*.js"
            TargetOriginId: shiptrack-server
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          - PathPattern: "*.css"
            TargetOriginId: shiptrack-server
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          - PathPattern: "/media/*"
            TargetOriginId: shiptrack-server
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # ------------------------------------------------------------------ cost guardrail (doc: alarm at $5 on day one)
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: shiptrack-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  # ------------------------------------------------------------------ GitHub Actions deploys
  # Exactly what a deploy needs: push the 5 images, run a command on THIS instance, read the results.
  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: shiptrack-deploy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:CompleteLayerUpload
              - ecr:InitiateLayerUpload
              - ecr:PutImage
              - ecr:UploadLayerPart
            Resource:
              - !GetAtt AuthRepo.Arn
              - !GetAtt ShipmentRepo.Arn
              - !GetAtt BillingRepo.Arn
              - !GetAtt TrackingRepo.Arn
              - !GetAtt GatewayRepo.Arn
              - !GetAtt FrontendRepo.Arn
          - Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
              - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
          - Effect: Allow
            Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations, ssm:DescribeInstanceInformation, ec2:DescribeInstances]
            Resource: "*"
          - Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  # Option A (default): a deploy-only IAM user. Its access key is created by you in CloudShell, never by this
  # template, so the secret never appears in CloudFormation outputs or events.
  DeployUser:
    Type: AWS::IAM::User
    Condition: UseAccessKey
    Properties:
      UserName: shiptrack-github-deploy
      ManagedPolicyArns: [!Ref DeployPolicy]

  # Option B: keyless GitHub OIDC (no long-lived keys), where the account allows it.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Condition: UseOidc
    Properties:
      RoleName: shiptrack-github-deploy
      ManagedPolicyArns: [!Ref DeployPolicy]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/main"

Outputs:
  WebsiteUrl:
    Description: The site (https). Stays the same across server stop/start.
    Value: !Sub "https://${Distribution.DomainName}"
  SwaggerUrl:
    Value: !Sub "https://${Distribution.DomainName}/swagger-ui.html"
  ServerIp:
    Description: Fixed public IP of the server. Only CloudFront can reach it; use Session Manager for a shell.
    Value: !Ref ElasticIp
  InstanceId:
    Description: The EC2 instance (the deploy finds it by its shiptrack-prod tag).
    Value: !Ref Instance
  DeployUserName:
    Condition: UseAccessKey
    Description: Create its access key in CloudShell (docs/DEPLOYMENT.md) and store it as GitHub secrets.
    Value: !Ref DeployUser
  DeployRoleArn:
    Condition: UseOidc
    Description: Set as GitHub repo variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  Region:
    Description: Set as GitHub repo variable AWS_REGION.
    Value: !Ref AWS::Region
