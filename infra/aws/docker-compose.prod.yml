# Production stack on the EC2 instance (ADR 0007). Same services as docker-compose.yml, but:
# - prebuilt images from ECR (tag = git commit), nothing is built on the server
# - secrets come from Secrets Manager via scripts/deploy-on-host.sh (written to a root-only .env)
# - logs go to CloudWatch; only the gateway is reachable, on port 80
# - memory limits so 5 JVMs + MySQL fit in 4 GB
name: shiptrack

x-service: &service
  restart: unless-stopped
  mem_limit: 512m
  logging:
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION}
      awslogs-group: ${LOG_GROUP}
      tag: "{{.Name}}"
  depends_on:
    mysql:
      condition: service_healthy

x-service-env: &service-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USERNAME: shiptrack
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 768m
    command: ["--innodb-buffer-pool-size=256M", "--performance-schema=OFF", "--skip-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: shiptrack
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: awslogs
      options: { awslogs-region: "${AWS_REGION}", awslogs-group: "${LOG_GROUP}", tag: "mysql" }
    healthcheck:
      # mysqladmin ping exits 0 as soon as the server answers, even with no/denied credentials, so no password
      # is needed here and quoting can't break it.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s
      start_interval: 2s

  auth-service:
    <<: *service
    image: ${ECR_REGISTRY}/shiptrack/auth-service:${IMAGE_TAG}
    environment:
      <<: *service-env
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

  shipment-service:
    <<: *service
    image: ${ECR_REGISTRY}/shiptrack/shipment-service:${IMAGE_TAG}
    environment:
      <<: *service-env
      AUTH_SERVICE_URL: http://auth-service:8081
      BILLING_SERVICE_URL: http://billing-service:8083

  billing-service:
    <<: *service
    image: ${ECR_REGISTRY}/shiptrack/billing-service:${IMAGE_TAG}
    environment:
      <<: *service-env

  tracking-service:
    <<: *service
    image: ${ECR_REGISTRY}/shiptrack/tracking-service:${IMAGE_TAG}
    environment:
      <<: *service-env
      SHIPMENT_SERVICE_URL: http://shipment-service:8082

  api-gateway:
    <<: *service
    image: ${ECR_REGISTRY}/shiptrack/api-gateway:${IMAGE_TAG}
    depends_on:
      auth-service: { condition: service_healthy }
      shipment-service: { condition: service_healthy }
      billing-service: { condition: service_healthy }
      tracking-service: { condition: service_healthy }
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      SHIPMENT_SERVICE_URL: http://shipment-service:8082
      BILLING_SERVICE_URL: http://billing-service:8083
      TRACKING_SERVICE_URL: http://tracking-service:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    ports:
      - "80:8080"

volumes:
  mysql-data:
