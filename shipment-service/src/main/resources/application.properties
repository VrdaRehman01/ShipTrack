spring.application.name=shipment-service
server.port=${SHIPMENT_SERVICE_PORT:8082}
server.forward-headers-strategy=framework
spring.threads.virtual.enabled=true

# Lets you run from the IDE using the repo-root .env (git-ignored). Missing file is fine.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${SHIPMENT_DB_NAME:shipment_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Default pool (10) queues requests at ~100 concurrent users; MySQL allows 151 connections in total.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/migration

# --- Security (shiptrack-common) ---
shiptrack.jwt.secret=${JWT_SECRET}
shiptrack.jwt.issuer=shiptrack-auth
shiptrack.security.public-paths=/api/v1/public/**
# Used to call billing-service's /internal/** API.
shiptrack.security.internal-api-key=${INTERNAL_API_KEY:}

# --- Other services ---
shiptrack.clients.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
shiptrack.clients.billing.url=${BILLING_SERVICE_URL:http://localhost:8083}
# How often to retry invoices that failed while billing was down.
shiptrack.billing.retry-interval=${BILLING_RETRY_INTERVAL:60s}
shiptrack.billing.circuit-breaker.wait-in-open-state=30s
# Right after delivery: quick attempts (1s, 2s backoff) before leaving it to the retry job.
shiptrack.billing.immediate-attempts=3
shiptrack.billing.immediate-backoff=1s
shiptrack.clients.billing.read-timeout=5s

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.cache.disabled=true
